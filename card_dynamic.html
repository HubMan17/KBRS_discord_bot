<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>{{ username }} — Aurora Edge</title>
  </head>
  <body class="m-0 p-0 overflow-hidden">
    <div class="relative w-[500px] h-[188px] rounded-[18px] overflow-hidden">
      <div class="absolute inset-0 bg-[#0f1118]"></div>
      <div
        class="absolute inset-0 bg-[radial-gradient(circle_at_85%_70%,rgba(59,130,246,0.35)_0%,rgba(147,197,253,0.25)_25%,rgba(168,85,247,0.2)_55%,rgba(15,23,42,0.8)_100%)]"
      ></div>
      <div
        class="absolute bottom-[-60px] right-[40px] w-[340px] h-[200px] rounded-full bg-gradient-to-t from-[#67e8f9]/30 via-[#818cf8]/20 to-transparent blur-[100px]"
      ></div>

      <svg
        class="absolute inset-0 opacity-55"
        viewBox="0 0 500 188"
        preserveAspectRatio="none"
      >
        <defs>
          <linearGradient id="edgeGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
            <stop offset="50%" stop-color="#818cf8" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.2" />
          </linearGradient>
        </defs>
        <path
          d="M0,140 C60,120 150,130 240,100 C330,70 410,100 480,80 C500,100 500,140 500,188 L0,188 Z"
          fill="url(#edgeGradient)"
        />
      </svg>

      <div
        class="absolute inset-0 bg-[repeating-linear-gradient(125deg,rgba(255,255,255,0.05)_0,rgba(255,255,255,0.05)_10px,transparent_10px,transparent_32px)] opacity-20 mix-blend-overlay"
      ></div>

      <div
        class="absolute top-0 right-0 w-[55%] h-[40%] bg-gradient-to-tl from-[#0b0d13]/75 via-[#0b0d13]/45 to-transparent"
      ></div>

      <div
        class="absolute inset-0 opacity-[0.03] mix-blend-overlay [background-image:url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'160\' height=\'160\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.75\' numOctaves=\'2\' stitchTiles=\'stitch\'/></filter><rect width=\'100%\' height=\'100%\' filter=\'url(%23n)\' opacity=\'0.45\'/></svg>')]"
      ></div>

      <div class="absolute w-full h-full flex">
        <div class="relative h-[110px] w-[110px] top-5 left-5">
          {% if avatar %}
          <img
            class="w-full h-full rounded-full opacity-75 border border-[#818cf8]"
            src="{{ avatar }}"
            alt="{{ username }}"
          />
          {% else %}
          <div
            class="w-full h-full flex items-center justify-center rounded-full bg-[#818cf8] text-white text-4xl font-bold opacity-75 border border-[#818cf8]"
          >
            {{ initials }}
          </div>
          {% endif %}
        </div>

        <div class="flex-1">
          <div
            class="relative z-10 h-full w-full p-6 pl-16 flex flex-col justify-between"
          >
            <div class="w-full flex items-center pl-4">
              <h2 class="text-white/90 text-3xl">{{ username }}</h2>
            </div>

            <div>
              <div class="flex flex-col gap-1">
                <p class="text-white/90 text-lg">{{ label_lvl }} {{ level }}</p>

                <!-- Progress bar -->
                <div
                  class="relative flex items-center h-7 w-full border-2 border-gray-400 rounded-xl overflow-hidden"
                >
                  <span
                    class="absolute left-0 top-0 bg-gray-800 h-7 rounded-xl"
                    style="width: {{ progress_pct }}%;"
                  ></span>
                  <p class="w-full text-center text-white/90 z-10">
                    {{ value }} / {{ max }}
                  </p>
                </div>

                <!-- Stats -->
                <div
                  class="flex items-center justify-between text-white/90 text-sm"
                >
                  <p>{{ label_rank }}: {{ rank }}</p>
                  <p>{{ label_top }}: {{ top }}</p>
                  <p>{{ label_next }}: {{ max }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
