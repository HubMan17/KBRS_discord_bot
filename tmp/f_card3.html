<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-[188px] w-[500px]">
    <div class="relative w-full h-full overflow-hidden rounded-3xl shadow-2xl">
      <!-- Base gradient -->
      <div
        class="absolute inset-0 bg-gradient-to-tr from-[#183d5d] via-[#365f85] to-[#76b4d6]"
      ></div>

      <!-- Conic swirl for color play (aqua / violet highlights) -->
      <div
        class="absolute -inset-[20%] bg-[conic-gradient(at_75%_20%,#67e8f9_0deg,#38bdf8_90deg,#a5f3fc_180deg,#60a5fa_270deg,#67e8f9_360deg)] opacity-40 blur-2xl mix-blend-screen"
      ></div>

      <!-- Soft radial glows -->
      <div
        class="absolute -left-24 -top-24 h-72 w-72 rounded-full bg-[#7dd3fc] opacity-30 blur-[80px]"
      ></div>
      <div
        class="absolute right-0 -bottom-16 h-80 w-80 rounded-full bg-[#a5f3fc] opacity-30 blur-[80px]"
      ></div>

      <!-- Diagonal ribbons -->
      <div
        class="absolute inset-0 opacity-30 mix-blend-overlay bg-[repeating-linear-gradient(115deg,rgba(255,255,255,0.07)_0,rgba(255,255,255,0.07)_14px,transparent_14px,transparent_44px)]"
      ></div>

      <!-- Wavy shapes layer using SVG -->
      <svg
        class="absolute inset-0 opacity-60"
        viewBox="0 0 700 300"
        preserveAspectRatio="none"
      >
        <defs>
          <linearGradient id="wave1" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.4" />
          </linearGradient>
          <linearGradient id="wave2" x1="1" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.35" />
            <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0.15" />
          </linearGradient>
        </defs>

        <!-- Back wave -->
        <path
          d="M0,180 C120,130 220,230 350,180 C470,135 550,220 700,170 L700,300 L0,300 Z"
          fill="url(#wave2)"
        />
        <!-- Middle wave -->
        <path
          d="M0,140 C120,90 240,210 360,150 C490,90 570,180 700,130 L700,300 L0,300 Z"
          fill="url(#wave1)"
        />
        <!-- Top highlight wave -->
        <path
          d="M0,110 C140,70 250,150 370,110 C500,70 580,140 700,95"
          fill="none"
          stroke="white"
          stroke-opacity="0.2"
          stroke-width="5"
        />
      </svg>

      <!-- Subtle texture grain -->
      <div
        class="absolute inset-0 opacity-[0.06] mix-blend-overlay [background-image:url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'160\' height=\'160\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.9\' numOctaves=\'2\' stitchTiles=\'stitch\'/></filter><rect width=\'100%\' height=\'100%\' filter=\'url(%23n)\' opacity=\'0.4\'/></svg>')]"
      ></div>

      <div class="absolute w-full h-full flex">
        <div class="relative h-[110px] w-[110px] top-5 left-5">
          {% if avatar %}
          <img
            class="w-full h-full rounded-full opacity-75 border border-[#818cf8]"
            src="{{ avatar }}"
            alt="{{ username }}"
          />
          {% else %}
          <div
            class="w-full h-full flex items-center justify-center rounded-full bg-[#818cf8] text-white text-4xl font-bold opacity-75 border border-[#818cf8]"
          >
            {{ initials }}
          </div>
          {% endif %}
        </div>

        <div class="flex-1">
          <div
            class="relative z-10 h-full w-full p-6 pl-16 flex flex-col justify-between"
          >
            <div class="w-full flex items-center pl-4">
              <h2 class="text-white/90 text-3xl">{{ username }}</h2>
            </div>

            <div>
              <div class="flex flex-col gap-1">
                <p class="text-white/90 text-lg">Lvl {{ level }}</p>

                <!-- Progress bar -->
                <div
                  class="relative flex items-center h-7 w-full border-2 border-gray-400 rounded-xl overflow-hidden"
                >
                  <span
                    class="absolute left-0 top-0 bg-gray-800 h-7 rounded-xl"
                    style="width: {{ progress_pct }}%;"
                  ></span>
                  <p class="w-full text-center text-white/90 z-10">
                    {{ value }} / {{ max }}
                  </p>
                </div>

                <!-- Stats -->
                <div
                  class="flex items-center justify-between text-white/90 text-sm"
                >
                  <p>Rank: {{ rank }}</p>
                  <p>Top: {{ top }}</p>
                  <p>Next: {{ max }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
