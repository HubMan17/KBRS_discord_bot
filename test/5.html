<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Card BG — Right Flow Geometry</title>
  </head>
  <body class="m-0 p-0 overflow-hidden">
    <!-- Balanced card: calm left area, geometric gradient waves on the right -->
    <div class="relative w-[500px] h-[188px] rounded-[18px] overflow-hidden">
      <!-- Neutral base for left area -->
      <div class="absolute inset-0 bg-[#12141b]"></div>

      <!-- Smooth horizontal gradient starting at 70% width -->
      <div
        class="absolute inset-0 bg-[linear-gradient(110deg,rgba(18,20,27,1)_0%,rgba(18,20,27,1)_65%,rgba(66,83,117,0.85)_75%,rgba(127,108,187,0.9)_85%,rgba(191,178,255,0.9)_100%)]"
      ></div>

      <!-- Subtle flowing wave-like geometry on the right side -->
      <svg
        class="absolute inset-0 opacity-50"
        viewBox="0 0 500 188"
        preserveAspectRatio="none"
      >
        <defs>
          <linearGradient id="waveGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4" />
            <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#c084fc" stop-opacity="0.15" />
          </linearGradient>
        </defs>
        <path
          d="M300,0 C340,60 380,60 420,0 C460,60 500,60 500,120 C480,170 420,188 350,160 C280,140 260,100 240,80 C220,60 200,50 180,70 C160,90 140,120 100,130 L0,150 L0,0 Z"
          fill="url(#waveGradient)"
        />
      </svg>

      <!-- Slight dark overlay on top-right for better text contrast -->
      <div
        class="absolute top-0 right-0 w-[50%] h-[40%] bg-gradient-to-tl from-[#0b0d13]/70 to-transparent"
      ></div>

      <!-- Soft texture for realism -->
      <div
        class="absolute inset-0 opacity-[0.04] mix-blend-overlay [background-image:url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'160\' height=\'160\'><filter id=\'n\'><feTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'2\' stitchTiles=\'stitch\'/></filter><rect width=\'100%\' height=\'100%\' filter=\'url(%23n)\' opacity=\'0.5\'/></svg>')]"
      ></div>
    </div>
  </body>
</html>
